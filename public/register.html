<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create account | MyBlog</title>
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body data-page="register" class="auth-loading">
    <div id="pageLoader" class="page-loader">
      <div class="spinner"></div>
      <p>Loading MyBlog...</p>
    </div>
    <header class="site-header">
      <a class="brand" href="/">My<span>Blog</span></a>
      <nav class="nav-links">
        <a class="active" href="/">Home</a>
        <a href="/explore.html">Explore</a>

        <!-- Guest (Logged Out) Links -->
        <a class="guest" href="/login.html">Log in</a>

        <!-- Member (Logged In) Links -->
        <a class="member" href="/dashboard.html" hidden>Dashboard</a>
        <a class="member" href="/dashboard.html#editor" hidden>Start writing</a>
        <button class="link-button member" data-logout hidden>Log out</button>
      </nav>
    </header>
    <main class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">START WRITING</p>
        <h1>Create your account</h1>
        <p class="lede">Your next idea deserves a home.</p>
        <p id="notice" class="notice" role="status"></p>
        <form id="registerForm">
          <label
            >Your name<input
              name="name"
              autocomplete="name"
              required
              minlength="2"
              maxlength="80"
              placeholder="Your name" /></label
          ><label
            >Email address<input
              name="email"
              type="email"
              autocomplete="email"
              required
              maxlength="254"
              placeholder="you@example.com" /></label
          ><label
            >Password<input
              name="password"
              type="password"
              autocomplete="new-password"
              required
              minlength="12"
              maxlength="128"
              placeholder="Create a strong password" /></label
          ><small
            >Use 12+ characters with upper/lower case, a number, and a
            symbol.</small
          ><button class="button wide">Create account</button>
        </form>
        <p class="auth-switch">
          Already have an account? <a href="/login.html">Log in</a>
        </p>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
