<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Log in | MyBlog</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body data-page="login" class="auth-loading">
    <div id="pageLoader" class="page-loader">
        <div class="spinner"></div>
        <p>Loading MyBlog...</p>
    </div>
    <header class="site-header"><a class="brand" href="/">My<span>Blog</span></a>
        <nav class="nav-links">
            <a class="active" href="/">Home</a>
            <a href="/explore.html">Explore</a>

            <!-- Guest (Logged Out) Links -->
            <a class="guest" href="/login.html">Log in</a>

            <!-- Member (Logged In) Links -->
            <a class="member" href="/dashboard.html" hidden>Dashboard</a>
            <a class="member" href="/dashboard.html#editor" hidden>Start writing</a>
            <button class="link-button member" data-logout hidden>Log out</button>
        </nav>
    </header>
    <main class="auth-shell">
        <section class="auth-card">
            <p class="eyebrow">WELCOME BACK</p>
            <h1>Log in to MyBlog</h1>
            <p class="lede">Pick up where your last idea left off.</p>
            <p id="notice" class="notice" role="status"></p>
            <form id="loginForm"><label>Email address<input name="email" type="email" autocomplete="email" required
                        maxlength="254" placeholder="you@example.com"></label><label>Password<input name="password"
                        type="password" autocomplete="current-password" required maxlength="128"
                        placeholder="Your password"></label><button class="button wide">Log in</button></form>
            <p class="auth-switch">New to MyBlog? <a href="/register.html">Create an account</a></p>
        </section>
    </main>
    <script src="/app.js" defer></script>
</body>

</html>
